<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Dark Luxury Obsidian Background Gradient -->
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="50%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Bar 1 (Left - Shortest) Gradient: Deep cobalt to vibrant blue -->
    <linearGradient id="favLogoBar1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Bar 2 (Middle) Gradient -->
    <linearGradient id="favLogoBar2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Bar 3 Main Body (Cobalt Blue) -->
    <linearGradient id="favLogoBar3Main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Bar 3 Specular Right Facet (Lighter Sky Blue Architectural Reflection) -->
    <linearGradient id="favLogoBar3Facet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Top Cut Bevel Highlights -->
    <linearGradient id="favTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.3" />
    </linearGradient>

    <!-- Swoosh Light Glow Filter -->
    <filter id="favSwooshGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Specular White Shimmer Gradient for Swoosh -->
    <linearGradient id="favSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- Luxury Obsidian Rounded Base Tile -->
  <rect width="128" height="128" rx="26" fill="url(#favBgGrad)" />

  <!-- 3 Ascending Architectural Glass Bars (Flat Base Y=102) -->
  <!-- Bar 1 (Left): X=26..46 -->
  <path d="M 26 74 L 46 68 L 46 102 L 26 102 Z" fill="url(#favLogoBar1)" />
  <line x1="26" y1="74" x2="46" y2="68" stroke="url(#favTopBevel)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bar 2 (Middle): X=52..72 -->
  <path d="M 52 46 L 72 40 L 72 102 L 52 102 Z" fill="url(#favLogoBar2)" />
  <line x1="52" y1="46" x2="72" y2="40" stroke="url(#favTopBevel)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bar 3 (Tallest - Right): X=78..102 -->
  <path d="M 78 18 L 90 14.4 L 90 102 L 78 102 Z" fill="url(#favLogoBar3Main)" />
  <path d="M 90 14.4 L 102 10.8 L 102 102 L 90 102 Z" fill="url(#favLogoBar3Facet)" />
  <line x1="78" y1="18" x2="102" y2="10.8" stroke="url(#favTopBevel)" stroke-width="1.4" stroke-linecap="round" />
  <line x1="102" y1="10.8" x2="102" y2="102" stroke="#bae6fd" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Swoosh Arc -->
  <!-- Ambient Electric Cyan Aura -->
  <path d="M 40 86 C 54 85, 72 75.5, 96 48.5 C 73 72.5, 55 83, 40 86 Z" fill="#38bdf8" opacity="0.85" filter="url(#favSwooshGlow)" />

  <!-- Bright White Radiant Light Beam -->
  <path d="M 41 85.5 C 54.5 84.8, 72 75.8, 95 49 C 73.2 72.2, 55.5 82.8, 41 85.5 Z" fill="url(#favSwooshGrad)" filter="url(#favSwooshGlow)" opacity="0.95" />

  <!-- Razor-Sharp Pure White Core Arc -->
  <path d="M 42 85 C 55 84.5, 72 76, 94 49.5 C 73.5 72, 56 82.5, 42 85 Z" fill="#ffffff" />

  <!-- Center Specular Flare on Arc -->
  <circle cx="69" cy="75" r="1.8" fill="#ffffff" filter="url(#favSwooshGlow)" />
  <circle cx="69" cy="75" r="0.9" fill="#ffffff" />
</svg>